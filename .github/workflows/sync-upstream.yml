name: Sync with upstream

# Merges the latest makeplane/plane-mcp-server `main` into this fork's `main`,
# keeping our commits (GHCR build + Authentik OIDC connector) on top, then pushes.
#
# If the merge hits a conflict the job fails. Resolve locally:
#   git fetch upstream main && git merge upstream/main
#   # fix conflicts, git add -A && git commit
#   git push origin main
# See MAINTENANCE.md §3. On failure this workflow can also ping a Claude routine
# (MAINTENANCE.md §3.3) to attempt the resolution and open a PR.

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/makeplane/plane-mcp-server.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    name: Merge upstream changes
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          # Use a PAT here instead of GITHUB_TOKEN if you want the resulting
          # push to trigger the docker-publish workflow (GITHUB_TOKEN pushes
          # do not trigger other workflows).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream
        run: |
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

      - name: Push changes
        run: |
          git push origin "${TARGET_BRANCH}"

      - name: Notify Claude routine on failure (optional)
        # Fires the Claude routine so it can attempt the merge-conflict
        # resolution and open a PR against main. Skipped until the
        # CLAUDE_ROUTINE_URL and CLAUDE_ROUTINE_TOKEN repo secrets are set.
        # See MAINTENANCE.md §3.3.
        if: failure()
        continue-on-error: true
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$CLAUDE_ROUTINE_URL" ] || [ -z "$CLAUDE_ROUTINE_TOKEN" ]; then
            echo "Webhook not configured, skipping."
            exit 0
          fi
          TEXT="Merge of upstream/${UPSTREAM_BRANCH} into ${TARGET_BRANCH} failed in ${REPO}. repo=${REPO} branch=${TARGET_BRANCH} upstream_branch=${UPSTREAM_BRANCH} run_url=${RUN_URL}"
          curl -sS --fail-with-body -X POST "$CLAUDE_ROUTINE_URL" \
            -H "Authorization: Bearer $CLAUDE_ROUTINE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg text "$TEXT" '{text:$text}')"

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling an active workflow through the API resets that timer.
    name: Keep schedule enabled
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"
